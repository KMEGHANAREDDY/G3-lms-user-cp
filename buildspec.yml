version: 0.2

phases:
  pre_build:
    commands:
      - echo Logging in to Amazon ECR...
      - aws ecr get-login-password --region ap-northeast-3 | docker login --username AWS --password-stdin 124355663661.dkr.ecr.ap-northeast-3.amazonaws.com

  build:
    commands:
      - echo Build started on `date`
      - echo Building the Docker image...
      - cd user_profile
      - docker build -t g3-lms-userprofile .
      - docker tag g3-lms-userprofile:user 124355663661.dkr.ecr.ap-northeast-3.amazonaws.com/g3-lms-userprofile:user

  post_build:
    commands:
      - echo Build completed on `date`
      - echo Pushing the Docker image...
      - docker push 124355663661.dkr.ecr.ap-northeast-3.amazonaws.com/g3-lms-userprofile:user
      - echo Writing image definitions file...
      - printf '[{"name":"g3-lms-userprofile","imageUri":"%s"}]' 124355663661.dkr.ecr.ap-northeast-3.amazonaws.com/g3-lms-userprofile:user > imagedefinitions.json

artifacts:
  files:
    - imagedefinitions.json